<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Echo">
  <!-- Like the desktop icon, this one cannot be theme-aware: it sits on an
       unknown-colour browser toolbar. So it carries its own paper ground
       rather than inheriting, exactly as CLAUDE.md prescribes for the Tauri
       icon. Ink waveform on paper, square ends, no accent hue. -->
  <rect width="128" height="128" fill="#fbfbfa"/>
  <g fill="#000000">
    <rect x="14"  y="55"  width="11" height="18"/>
    <rect x="32"  y="41"  width="11" height="46"/>
    <rect x="50"  y="23"  width="11" height="82"/>
    <rect x="68"  y="46"  width="11" height="36"/>
    <rect x="86"  y="32"  width="11" height="64"/>
    <rect x="104" y="50"  width="11" height="28"/>
  </g>
</svg>
